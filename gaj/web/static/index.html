<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坑位图鉴 — 个人猎头系统</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="/static/app.js"></script>
<script defer src="/static/alpine.min.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body x-data="app()" x-init="init()" x-cloak>

<!-- Toast 通知容器 -->
<div class="toast-container">
  <template x-for="t in toasts" :key="t.id">
    <div class="toast" :class="t.type" x-text="t.msg" @click="removeToast(t.id)"></div>
  </template>
</div>

<div class="app-shell">

  <!-- Header -->
  <div class="header">
    <h1><i data-lucide="target"></i> 坑位图鉴</h1>
    <div class="stats">
      <span class="stat-pill">
        <i data-lucide="briefcase"></i>
        <span class="stat-num" x-text="stats.total || 0"></span>
        <span>职位</span>
      </span>
      <span class="stat-pill">
        <i data-lucide="check-circle" style="color: var(--gaj-state-success);"></i>
        <span class="stat-num" x-text="stats.scored_rule || 0"></span>
        <span>规则打分</span>
      </span>
      <span class="stat-pill">
        <i data-lucide="bot" style="color: var(--gaj-state-purple);"></i>
        <span class="stat-num" x-text="stats.scored_ai || 0"></span>
        <span>AI打分</span>
      </span>
      <span class="stat-pill">
        <i data-lucide="clock" style="color: var(--gaj-foreground-3);"></i>
        <span class="stat-num" x-text="stats.unscored || 0"></span>
        <span>未打分</span>
      </span>
      <span class="stat-pill">
        <i data-lucide="star" style="color: var(--gaj-state-warning);"></i>
        <span class="stat-num" x-text="stats.favorite || 0"></span>
        <span>收藏</span>
      </span>
      <span class="stat-pill" x-show="stats.ignored > 0">
        <i data-lucide="eye-off" style="color: var(--gaj-foreground-3);"></i>
        <span class="stat-num" x-text="stats.ignored || 0"></span>
        <span>已忽略</span>
      </span>
    </div>
    <div class="actions">
      <div class="view-switch">
        <button :class="{active: !showGuide}" @click="showGuide = false" title="岗位分数排名列表">
          <i data-lucide="briefcase"></i>
          <span>职位列表</span>
        </button>
        <button :class="{active: showGuide}" @click="openGuide()" title="公司维度图鉴: 排名/象限/对比">
          <i data-lucide="library-big"></i>
          <span>公司图鉴</span>
        </button>
      </div>
      <button @click="selectMode = !selectMode; if(!selectMode) clearSelection()" :class="{primary: selectMode}" x-show="!showGuide">
        <i data-lucide="list-checks"></i>
        <span x-show="!selectMode">批量</span>
        <span x-show="selectMode">退出批量</span>
      </button>
      <button @click="showConfig = !showConfig; if(showConfig) configTab='rules'" :class="{primary: showConfig}">
        <i data-lucide="settings"></i>
        <span>规则配置</span>
      </button>
      <button @click="showResume = !showResume" :class="{primary: showResume}">
        <i data-lucide="file-text"></i>
        <span x-show="!resumeData.exists">上传简历</span>
        <span x-show="resumeData.exists">简历已上传</span>
      </button>
      <button @click="scoreAll()" :disabled="taskRunning('score-all')" class="primary">
        <i data-lucide="zap"></i>
        <span x-show="!taskRunning('score-all')">规则打分</span>
        <span x-show="taskRunning('score-all')">打分中...</span>
      </button>
    </div>
  </div>

  <!-- Config Panel -->
  <div class="config-panel" x-show="showConfig" x-cloak style="flex:1;" x-effect="showConfig; configTab; $nextTick(() => window.refreshIconsDebounced && window.refreshIconsDebounced())">
    <div class="config-tabs">
      <button :class="{active: configTab==='rules'}" @click="configTab='rules'">
        <i data-lucide="bar-chart-3"></i>
        <span>规则概览</span>
      </button>
      <button :class="{active: configTab==='profile'}" @click="configTab='profile'">
        <i data-lucide="user"></i>
        <span>画像编辑</span>
      </button>
      <button @click="showConfig=false" style="margin-left:auto; border-bottom: 2px solid transparent;">
        <i data-lucide="x"></i>
        <span>关闭</span>
      </button>
    </div>

    <!-- Tab: 规则概览 -->
    <div x-show="configTab==='rules'" class="config-body">
      <div class="config-body-inner">
      <template x-if="rulesCatalog">
        <div>
          <div class="config-meta">
            <span>规则版本: <strong x-text="rulesCatalog.version"></strong></span>
            <span>权重来源: <strong x-text="rulesCatalog.weights_source"></strong></span>
            <span style="display:inline-flex;align-items:center;gap:6px;">
              淘汰置信度下限:
              <input type="number" step="0.1" min="0" max="1" class="rule-max-input"
                     :value="rulesEdit.reject_confidence_floor != null ? rulesEdit.reject_confidence_floor : rulesCatalog.default_reject_confidence_floor"
                     @input="rulesEdit.reject_confidence_floor = parseFloat($event.target.value)"
                     style="width:50px">
              <span class="rule-default" @click="rulesEdit.reject_confidence_floor = null"
                    x-text="'↺ 默认'+(rulesCatalog.default_reject_confidence_floor*100)+'%'"></span>
              <span style="color:var(--gaj-foreground-3);">(证据置信度低于此值只标 REVIEW 不淘汰)</span>
            </span>
          </div>

          <div class="profile-actions" style="margin-bottom: 12px; border-top: none; padding-top: 0; margin-top: 0;">
            <button class="primary" @click="saveScoringConfig()" :disabled="rulesSaving">
              <i data-lucide="save"></i>
              <span x-show="!rulesSaving">保存规则参数</span>
              <span x-show="rulesSaving">保存中...</span>
            </button>
            <button @click="resetRulesEdit()">
              <i data-lucide="rotate-ccw"></i>
              <span>重置为加载时值</span>
            </button>
            <button @click="resetAllRulesDefault()">
              <i data-lucide="refresh-cw"></i>
              <span>全部恢复默认</span>
            </button>
            <span style="color:var(--gaj-foreground-3);font-size:var(--gaj-font-size-xs)">保存后请点击"规则打分"重新评分</span>
          </div>
          <div class="weight-presets" x-show="Object.keys(scoringPresets).length > 0">
            <span class="presets-label">配比预设:</span>
            <template x-for="(p, name) in scoringPresets" :key="name">
              <button class="preset-btn" @click="applyScoringPreset(name)" x-text="name"
                :title="'一键套用'+name+'的评分项配比 (各维度满分=10)'"></button>
            </template>
          </div>

          <div class="config-h">
            <i data-lucide="shield-x" style="color: var(--gaj-state-error);"></i>
            <span>硬性淘汰规则</span>
            <span class="heading-hint">(命中即淘汰, 证据不足只标 REVIEW)</span>
          </div>
          <div class="rule-grid">
            <template x-for="h in rulesCatalog.hard_checks" :key="h.code">
              <div class="rule-card reject">
                <div class="rule-code" x-text="h.code"></div>
                <div class="rule-label" x-text="h.label"></div>
                <div class="rule-detail" x-text="h.detail"></div>
                <template x-if="h.threshold">
                  <div class="rule-threshold">
                    <span class="rt-label">当前阈值:</span>
                    <span class="rt-value" x-text="formatThreshold(h.threshold)"></span>
                    <span class="rt-source" x-text="'← ' + h.threshold.source_label"></span>
                    <span class="rt-edit" @click="configTab='profile'">去画像编辑改</span>
                  </div>
                </template>
              </div>
            </template>
          </div>

          <div class="config-h">
            <i data-lucide="bar-chart-3" style="color: var(--gaj-primary);"></i>
            <span>四维度评分</span>
            <span class="heading-hint">(改满分后按比例缩放, 加权求和得总分)</span>
          </div>
          <template x-for="dim in rulesCatalog.dimensions" :key="dim.key">
            <div class="dim-block">
              <div class="dim-header">
                <strong x-text="dim.label"></strong>
                <span class="dim-max" :class="{'over-cap': parseFloat(dimMaxSum(dim)) > 10}"
                      x-text="'当前满分 '+dimMaxSum(dim)+' / 默认 '+dim.default_max_score"></span>
                <span class="dim-cap-warn" x-show="parseFloat(dimMaxSum(dim)) > 10">⚠ 超过封顶10, 实际最多算10分</span>
              </div>
              <div class="rule-grid">
                <template x-for="item in dim.items" :key="item.code">
                  <div class="rule-card" :class="{changed: rulesEdit[item.override_key] != null && rulesEdit[item.override_key] !== item.default_max}">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                      <div style="flex:1;min-width:0;">
                        <div class="rule-code" x-text="item.code"></div>
                        <div class="rule-label" x-text="item.label"></div>
                        <div class="rule-detail" x-text="item.detail"></div>
                      </div>
                      <div class="rule-max-row" style="margin-top:0;">
                        <label>满分:</label>
                        <input type="number" step="0.1" min="0" max="100" class="rule-max-input"
                               :value="rulesEdit[item.override_key] != null ? rulesEdit[item.override_key] : item.default_max"
                               @input="rulesEdit[item.override_key] = parseFloat($event.target.value)">
                        <span class="rule-default" @click="rulesEdit[item.override_key] = null"
                              x-text="'↺'+item.default_max"></span>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <div class="config-h">
            <i data-lucide="bot" style="color: var(--gaj-state-purple);"></i>
            <span>AI 介入触发条件</span>
            <span class="heading-hint">(规则力所不及时交给大模型)</span>
          </div>
          <div class="rule-grid">
            <template x-for="a in rulesCatalog.ai_triggers" :key="a.code">
              <div class="rule-card ai">
                <div class="rule-code" x-text="a.code"></div>
                <div class="rule-label" x-text="a.label"></div>
                <div class="rule-detail" x-text="a.detail"></div>
              </div>
            </template>
          </div>
        </div>
      </template>
      <div x-show="!rulesCatalog" class="loading">加载规则中...</div>
      </div>
    </div>

    <!-- Tab: 画像编辑 -->
    <div x-show="configTab==='profile'" class="config-body">
      <div class="config-body-inner">
      <template x-if="profileData">
        <div>
          <div class="config-meta">
            <span>当前权重(归一化): <strong x-text="profileData.weights ? '财务'+(profileData.weights.finance*100).toFixed(0)+'% / 成长'+(profileData.weights.growth*100).toFixed(0)+'% / 资源'+(profileData.weights.resource*100).toFixed(0)+'% / WLB'+(profileData.weights.wlb*100).toFixed(0)+'%' : ''"></strong></span>
          </div>
          <div class="profile-actions" style="margin-bottom: 12px; border-top: none; padding-top: 0; margin-top: 0;">
            <button class="primary" @click="saveProfile()" :disabled="profileSaving">
              <i data-lucide="save"></i>
              <span x-show="!profileSaving">保存画像</span>
              <span x-show="profileSaving">保存中...</span>
            </button>
            <button @click="loadProfile()">
              <i data-lucide="rotate-ccw"></i>
              <span>重新加载</span>
            </button>
            <span style="color:var(--gaj-foreground-3);font-size:var(--gaj-font-size-xs)">保存后请点击"规则打分"重新评分</span>
          </div>
          <template x-for="g in profileData.groups" :key="g.title">
            <div class="profile-group">
              <div class="config-h" x-text="g.title"></div>
              <template x-if="g.title.includes('价值观权重') && Object.keys(weightPresets).length > 0">
                <div class="weight-presets">
                  <span class="presets-label">快速预设:</span>
                  <template x-for="(p, name) in weightPresets" :key="name">
                    <button class="preset-btn" @click="applyWeightPreset(name)" x-text="name"
                      :title="'成长'+p.growth+'% / 财务'+p.finance+'% / WLB'+p.wlb+'% / 资源'+p.resource+'%'"></button>
                  </template>
                </div>
              </template>
              <div class="profile-fields">
                <template x-for="f in g.fields" :key="f.name">
                  <div class="profile-field">
                    <label x-text="f.label"></label>
                    <template x-if="f.type==='bool'">
                      <select x-model="profileData.fields[f.name]">
                        <option :value="true">是</option>
                        <option :value="false">否</option>
                      </select>
                    </template>
                    <template x-if="f.type==='list'">
                      <input type="text" x-model="profileData.fields[f.name]" placeholder="逗号分隔">
                    </template>
                    <template x-if="f.type==='str'">
                      <input type="text" x-model="profileData.fields[f.name]">
                    </template>
                    <template x-if="f.type==='int' || f.type==='float'">
                      <input type="number" step="any" x-model.number="profileData.fields[f.name]">
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>
      <div x-show="!profileData" class="loading">加载画像中...</div>
      </div>
    </div>
  </div>

  <!-- Resume Panel -->
  <div class="config-panel" x-show="showResume" x-cloak style="flex:1;" x-effect="showResume; $nextTick(() => window.refreshIconsDebounced && window.refreshIconsDebounced())">
    <div class="config-tabs">
      <button class="active">
        <i data-lucide="file-text"></i>
        <span>主简历 (Markdown)</span>
      </button>
      <button @click="showResume=false" style="margin-left:auto; border-bottom: 2px solid transparent;">
        <i data-lucide="x"></i>
        <span>关闭</span>
      </button>
    </div>
    <div class="config-body">
      <div class="config-body-inner">
      <div class="config-meta">
        <span>状态: <strong x-text="resumeData.exists ? '已上传' : '未上传'"></strong></span>
        <span x-show="resumeData.exists">字数: <strong x-text="resumeData.size"></strong></span>
        <span x-show="resumeData.exists" style="color: var(--gaj-state-success); display: inline-flex; align-items: center; gap: 4px;">
          <i data-lucide="check-circle"></i> AI 打分会自动融入此简历
        </span>
      </div>
      <div class="resume-upload-area">
        <input type="file" accept=".md,.markdown,text/markdown,text/plain"
               @change="onResumeFile($event)" x-ref="resumeFileInput"
               style="display:none">
        <button @click="$refs.resumeFileInput.click()">
          <i data-lucide="upload"></i>
          <span>选择 .md 文件上传</span>
        </button>
        <span style="color: var(--gaj-foreground-3); font-size: var(--gaj-font-size-xs);">或直接在下方粘贴/编辑</span>
      </div>
      <textarea class="resume-editor" x-model="resumeData.content"
                placeholder="在此粘贴或编辑你的 Markdown 简历...&#10;&#10;建议包含: 个人信息、专业技能、工作经历、项目经历、教育背景。&#10;这份简历会作为 AI 打分的人岗匹配参考, 也会用于针对性简历生成。"
                spellcheck="false"></textarea>
      <div class="profile-actions">
        <button @click="saveResume()" :disabled="resumeSaving" class="primary">
          <i data-lucide="save"></i>
          <span x-show="!resumeSaving">保存简历</span>
          <span x-show="resumeSaving">保存中...</span>
        </button>
        <button @click="clearResume()" x-show="resumeData.exists" class="danger">
          <i data-lucide="trash-2"></i>
          <span>清空</span>
        </button>
        <span x-show="resumeSavedAt" style="color: var(--gaj-state-success); font-size: var(--gaj-font-size-xs); display: inline-flex; align-items: center; gap: 4px;">
          <i data-lucide="check"></i> 已保存 <span x-text="resumeSavedAt"></span>
        </span>
      </div>
      </div>
    </div>
  </div>

  <!-- Guide Panel (公司图鉴) -->
  <div class="guide-panel" x-show="showGuide" x-cloak style="flex:1;"
       x-effect="guide.items.length; guide.mode; companyDetail; $nextTick(() => window.refreshIconsDebounced && window.refreshIconsDebounced())">
    <div class="guide-toolbar">
      <div class="guide-progress">
        <i data-lucide="book-open"></i>
        <span>图鉴进度: 已鉴定 <strong x-text="guide.facets?.unlocked || 0"></strong> / <span x-text="guide.facets?.total || 0"></span> 家公司</span>
        <span class="guide-fav-count" :class="{active: guide.favorite==='only'}"
              @click="guide.favorite = guide.favorite==='only' ? 'all' : 'only'; loadGuideItems()"
              title="想去清单">
          <i data-lucide="heart"></i>
          <span>想去</span>
          <strong x-text="guide.facets?.favorite || 0"></strong>
        </span>
      </div>
      <div class="guide-controls">
        <div class="leaderboard-switch" title="三榜即时切换">
          <button :class="{active: guide.sort==='score'}" @click="setGuideSort('score')"><i data-lucide="trophy"></i><span>分数榜</span></button>
          <button :class="{active: guide.sort==='jobs'}" @click="setGuideSort('jobs')"><i data-lucide="flame"></i><span>招聘力度榜</span></button>
          <button :class="{active: guide.sort==='salary'}" @click="setGuideSort('salary')"><i data-lucide="coins"></i><span>薪资榜</span></button>
        </div>
        <div class="guide-mode-switch">
          <button :class="{active: guide.mode==='cards'}" @click="setGuideMode('cards')"><i data-lucide="layout-grid"></i><span>卡片墙</span></button>
          <button :class="{active: guide.mode==='quadrant'}" @click="setGuideMode('quadrant')"><i data-lucide="scatter-chart"></i><span>象限图</span></button>
          <button :class="{active: guide.mode==='compare'}" @click="setGuideMode('compare')">
            <i data-lucide="scale"></i><span>对比</span>
            <span x-show="compareIds.length > 0" x-text="'(' + compareIds.length + ')'"></span>
          </button>
        </div>
        <input class="guide-search" type="text" placeholder="搜索公司名..." x-model="guide.q" @input.debounce.300ms="loadGuideItems()">
        <select class="filter-select" x-model="guide.industry" @change="loadGuideItems()">
          <option value="">全部行业</option>
          <template x-for="i in guide.facets?.industries || []" :key="i.value">
            <option :value="i.value" x-text="i.value + ' (' + i.count + ')'"></option>
          </template>
        </select>
        <select class="filter-select" x-model="guide.stage" @change="loadGuideItems()">
          <option value="">全部阶段</option>
          <template x-for="s in guide.facets?.stages || []" :key="s.value">
            <option :value="s.value" x-text="s.value + ' (' + s.count + ')'"></option>
          </template>
        </select>
      </div>
    </div>

    <div class="guide-body">
      <div class="loading" x-show="guide.loading">加载中...</div>
      <div class="empty" x-show="!guide.loading && guide.items.length === 0">
        <i data-lucide="building-2" style="width:32px;height:32px;color:var(--gaj-foreground-4);margin-bottom:8px;"></i>
        <div>没有匹配的公司</div>
      </div>

      <!-- 卡片墙 -->
      <div class="guide-grid" x-show="!guide.loading && guide.mode === 'cards'">
        <template x-for="c in guide.items" :key="c.brand_id">
          <div class="guide-card" :class="{locked: !guideUnlocked(c), 'in-compare': compareIds.includes(c.brand_id)}" @click="openCompany(c.brand_id)">
            <div class="gc-top">
              <span class="tier-badge" :class="tierClass(c.rank_tier)" x-show="c.rank_tier" x-text="c.rank_tier"></span>
              <span class="gc-name" x-text="c.name"></span>
              <button class="gc-fav" :class="{on: c.favorite}" @click.stop="toggleCompanyFavorite(c.brand_id, !c.favorite)" title="想去清单">
                <i data-lucide="heart" :fill="c.favorite ? 'currentColor' : 'none'"></i>
              </button>
            </div>
            <div class="gc-score-row">
              <span class="gc-score" :class="{'locked-score': !guideUnlocked(c)}"
                    x-text="guideUnlocked(c) && c.company_score != null ? c.company_score.toFixed(1) : '?'"></span>
              <span class="gc-score-cap">/10</span>
              <span class="gc-jobs" x-text="'在招 ' + (c.job_count || 0) + ' 岗'"></span>
            </div>
            <div class="gc-meta">
              <span x-text="c.industry || '??'"></span>
              <span class="sep">·</span>
              <span x-text="c.stage || '??'"></span>
              <span class="sep">·</span>
              <span x-text="c.scale_raw || '??'"></span>
            </div>
            <div class="gc-meta" x-show="guideUnlocked(c)">
              <span class="salary" x-text="c.salary_mid_avg ? '均薪 ' + c.salary_mid_avg.toFixed(1) + '万' : '薪资面议'"></span>
              <span class="sep">·</span>
              <span x-text="(c.cities || []).join('/') || '?'"></span>
            </div>
            <div class="gc-meta dim" x-show="!guideUnlocked(c)">
              <span>?? · 未解锁, 细节待鉴定</span>
            </div>
            <div class="gc-top-job" x-show="guideUnlocked(c) && c.top_job_title">
              <i data-lucide="crown"></i>
              <span class="gc-top-title" x-text="c.top_job_title"></span>
              <span class="gc-top-score" x-text="c.top_job_score != null ? c.top_job_score.toFixed(1) : ''"></span>
            </div>
            <div class="gc-actions" @click.stop>
              <template x-if="!guideUnlocked(c)">
                <button class="primary appraise-btn" @click="appraiseCompany(c)"
                        :disabled="!c.top_job_id || taskRunning('ai-score-' + c.top_job_id)"

      <!-- 象限图 -->
      <div class="quadrant-wrap" x-show="!guide.loading && guide.mode === 'quadrant'"
           x-data="{qd: {pts: [], unknown: [], xMax: 20}}"
           x-effect="guide.items; qd = quadrantData()">

          <i data-lucide="info"></i>
          <span>x = 平均薪资(万/月) · y = 公司分 · 气泡大小 = 在招岗位数 · 点击气泡进入公司</span>
        </div>
        <svg viewBox="0 0 760 440" class="quadrant-svg" @click="quadrantClick($event)">
          <g x-html="quadrantGridSvg(qd)"></g>
          <text x="726" y="36" class="qsweet" text-anchor="end">高分 · 高薪甜蜜点 ↗</text>
          <g x-html="quadrantBubblesSvg(qd)"></g>
        </svg>
        <div class="quadrant-unknown" x-show="qd.unknown.length > 0">

            <span class="qu-chip" @click="openCompany(c.brand_id)" x-text="c.name"></span>

        </div>
      </div>

      <!-- 对比模式 -->
      <div class="compare-wrap" x-show="!guide.loading && guide.mode === 'compare'">
        <div class="compare-empty" x-show="compareIds.length < 2">
          <i data-lucide="scale" style="width:32px;height:32px;color:var(--gaj-foreground-4);margin-bottom:8px;"></i>
          <div x-text="compareIds.length === 0 ? '在卡片墙点「加入对比」选 2-4 家公司, 并排看四维雷达与关键指标' : '再选 ' + (2 - compareIds.length) + ' 家公司即可开始对比'"></div>
          <button @click="setGuideMode('cards')">去挑选</button>
        </div>
        <div class="compare-grid" x-show="compareIds.length >= 2">
          <template x-for="id in compareIds" :key="id">
            <div class="compare-col">
              <div class="loading" x-show="!compareDetails[id]">加载中...</div>
              <template x-if="compareDetails[id]">

                  <div class="cc-header">
                    <span class="tier-badge" :class="tierClass(compareDetails[id].stats?.rank_tier)"

                    <span class="cc-name" @click="openCompany(id)" x-text="compareDetails[id].company.name"></span>
                    <button class="cc-remove" @click="toggleCompare(id)" title="移出对比"><i data-lucide="x"></i></button>
                  </div>
                  <div class="cc-score" x-text="compareDetails[id].stats?.company_score != null ? compareDetails[id].stats.company_score.toFixed(1) + ' /10' : '暂无公司分'"></div>
                  <svg viewBox="0 0 200 200" class="radar-svg">
                    <polygon points="100,30 170,100 100,170 30,100" class="radar-frame"></polygon>
                    <polygon points="100,65 135,100 100,135 65,100" class="radar-frame"></polygon>
                    <line x1="100" y1="30" x2="100" y2="170" class="radar-frame"></line>
                    <line x1="30" y1="100" x2="170" y2="100" class="radar-frame"></line>
                    <polygon :points="radarPoints(compareDetails[id].dims_avg, 100, 100, 70)" class="radar-shape"></polygon>
                    <text x="100" y="20" class="radar-label" text-anchor="middle">财务</text>
                    <text x="178" y="104" class="radar-label" text-anchor="start">成长</text>
                    <text x="100" y="190" class="radar-label" text-anchor="middle">资源</text>
                    <text x="22" y="104" class="radar-label" text-anchor="end">WLB</text>
                  </svg>
                  <div class="cc-metrics">
                    <div><span>规模</span><strong x-text="compareDetails[id].company.scale_raw || '??'"></strong></div>
                    <div><span>阶段</span><strong x-text="compareDetails[id].company.stage || '??'"></strong></div>
                    <div><span>均薪</span><strong x-text="compareDetails[id].stats?.salary_mid_avg ? compareDetails[id].stats.salary_mid_avg.toFixed(1) + '万' : '??'"></strong></div>
                    <div><span>在招</span><strong x-text="(compareDetails[id].stats?.job_count || 0) + ' 岗'"></strong></div>
                    <div><span>最佳岗位</span><strong x-text="compareDetails[id].stats?.top_job_title || '-'"></strong></div>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="main" x-show="!showConfig && !showResume && !showGuide" x-effect="jobs.length; selectedJobId; $nextTick(() => window.refreshIconsDebounced && window.refreshIconsDebounced())">

    <!-- Job List -->
    <div class="list-panel">
      <div class="filters">
        <div class="search-input">

        <div class="filter-row">

            </template>
          </select>
          <select class="filter-select" x-model="filters.status" @change="loadJobs()">
            <option value="">全部状态</option>
            <option value="PASS">通过</option>
            <option value="REVIEW">待复核</option>
            <option value="REJECTED">已淘汰</option>
          </select>
          <select class="filter-select" x-model="filters.scored" @change="loadJobs()">
            <option value="all">全部</option>
            <option value="none">未打分</option>
            <option value="rule_only">仅规则</option>
            <option value="ai">有AI打分</option>
            <option value="no_ai">无AI打分</option>
          </select>
          <select class="filter-select" x-model="filters.favorite" @change="loadJobs()">

            <option value="exclude">排除收藏</option>
          </select>
          <select class="filter-select" x-model="filters.ignored" @change="loadJobs()">
            <option value="exclude">排除忽略</option>
            <option value="all">含忽略</option>
            <option value="only">只看忽略</option>
          </select>
          <select class="filter-select" x-model="filters.sort" @change="loadJobs()">
            <option value="best_total">最佳分数</option>
            <option value="rule_total">规则分</option>
            <option value="latest_ai_total">AI分</option>
            <option value="salary_max">薪资上限</option>
            <option value="salary_min">薪资下限</option>
            <option value="salary_mid">薪资中位</option>
            <option value="favorited_at">收藏时间</option>
            <option value="last_seen">最近抓取</option>
            <option value="first_seen">首次抓取</option>
            <option value="quality_score">数据质量</option>
            <option value="jd_length">JD长度</option>
            <option value="exp_max">经验上限</option>
            <option value="title">职位名</option>
          </select>
        </div>
      </div>
      <!-- 批量操作工具栏 -->
      <div class="batch-bar" x-show="selectedIds.length > 0" x-cloak>

        <button @click="clearSelection()">取消选择</button>
        <button @click="selectAllOnPage()">全选本页</button>
      </div>
      <div class="job-list">
        <div class="loading" x-show="jobsLoading">加载中...</div>
        <div class="empty" x-show="!jobsLoading && jobs.length === 0">
          <i data-lucide="inbox" style="width:32px;height:32px;color:var(--gaj-foreground-4);margin-bottom:8px;"></i>
          <div>没有匹配的职位</div>
        </div>
        <template x-for="job in jobs" :key="job.job_id">
          <div class="job-item" :class="{active: selectedJobId === job.job_id, selected: selectedIds.includes(job.job_id)}" @click="selectJob(job.job_id)">

              <div class="title" x-text="job.title"></div>
              <span class="fav-badge" x-show="job.favorite" title="已收藏岗位">
                <i data-lucide="star" fill="currentColor"></i>
                <span>已藏</span>
              </span>
              <button class="ignore-btn" @click.stop="toggleIgnore(job.job_id, !job.ignored)" :class="{on: job.ignored}">

                <span x-show="!job.ignored">忽略</span>
                <span x-show="job.ignored">已忽略</span>
              </button>
            </div>
            <div class="meta">
              <span x-text="job.company_name || '未知'"></span>
              <span class="sep">·</span>
              <span x-text="job.city || ''"></span>
              <span class="sep">·</span>
              <span class="salary" x-text="job.salary_raw || '面议'"></span>
            </div>
            <div class="scores">
              <template x-if="job.rule_status">
                <span class="score-label" :class="job.rule_status.toLowerCase()" x-text="job.rule_status + ' ' + (job.rule_total || 0).toFixed(1)"></span>
              </template>
              <template x-if="job.rule_status">
                <div class="score-bar-track">
                  <div class="score-bar-fill" :style="'width:' + Math.min(100, (job.rule_total || 0) * 10) + '%; background:' + ({PASS:'var(--gaj-state-success)',REVIEW:'var(--gaj-state-warning)',REJECTED:'var(--gaj-state-error)'}[job.rule_status] || 'var(--gaj-foreground-3)')"></div>
                </div>
              </template>
              <template x-if="!job.rule_status">
                <span class="score-label none">未打分</span>
              </template>
              <template x-if="job.ai_count > 0">
                <span class="badge ai" :title="'AI 打分 ' + job.ai_count + ' 次'">
                  <i data-lucide="bot"></i>
                  <span x-text="job.ai_count + 'x'"></span>
                  <span x-show="job.latest_ai_total" x-text="job.latest_ai_total ? job.latest_ai_total.toFixed(1) : ''"></span>
                </span>
              </template>
              <template x-if="job.ai_needed && job.ai_count === 0">

              </template>
              <template x-if="job.ai_stale">
                <span class="badge stale"
                      :title="'需重打: ' + (job.ai_stale_reason === 'context_changed' ? '打分预期已变化' : job.ai_stale_reason === 'expired' ? '分数超过保鲜期' : (job.ai_stale_reason || '分数过时'))">
                  <i data-lucide="refresh-cw"></i>
                  <span>需重打</span>
                </span>
              </template>
            </div>
            <div class="skills-row" x-show="job.skills && job.skills.length">
              <template x-for="sk in (job.skills || []).slice(0, 5)" :key="sk">
                <span class="tag" x-text="sk"></span>
              </template>
              <span class="tag" x-show="(job.skills || []).length > 5" style="color:var(--gaj-foreground-3)" x-text="'+' + ((job.skills || []).length - 5)"></span>
            </div>
          </div>
        </template>
      </div>
      <div class="pagination">
        <button class="page-btn" @click="prevPage()" :disabled="filters.offset === 0"><i data-lucide="chevron-left"></i></button>
        <span style="font-size:var(--gaj-font-size-xs);color:var(--gaj-foreground-2);line-height:28px" x-text="(filters.offset + 1) + '-' + Math.min(filters.offset + jobs.length, jobsTotal) + ' / ' + jobsTotal"></span>
        <button class="page-btn" @click="nextPage()" :disabled="filters.offset + jobs.length >= jobsTotal"><i data-lucide="chevron-right"></i></button>
      </div>
      <div class="list-resizer" @mousedown="startResize($event)"></div>
    </div>

    <!-- Job Detail -->
    <div class="detail-panel">
      <div class="loading" x-show="detailLoading">加载中...</div>
      <div class="empty" x-show="!detailLoading && !detail">
        <i data-lucide="mouse-pointer-click" style="width:32px;height:32px;color:var(--gaj-foreground-4);margin-bottom:8px;"></i>
        <div>选择左侧职位查看详情</div>
      </div>
      <template x-if="detail && !detailLoading">
      <div class="detail-content" x-cloak x-data="{scrolled: false, activeSection: 'sec-basic', scrollToSection(id) { const el = document.getElementById(id); if (!el) return; const panel = el.closest('.detail-panel'); panel.scrollTo({top: el.offsetTop - 60, behavior: 'smooth'}); this.activeSection = id; }, trackSection(panel) { const ids = ['sec-basic','sec-rule','sec-manual','sec-ai','sec-jd','sec-company']; const panelTop = panel.getBoundingClientRect().top; for (let i = ids.length - 1; i >= 0; i--) { const s = document.getElementById(ids[i]); if (s && s.getBoundingClientRect().top - panelTop < 100) { this.activeSection = ids[i]; break; } } }}" x-init="$nextTick(() => { const el = document.querySelector('.detail-panel'); if (el) el.addEventListener('scroll', () => { scrolled = el.scrollTop > 180; trackSection(el); }); })">
        <!-- 滚动悬浮摘要条: 含操作按钮, 滚动时固定顶部 -->
        <div class="sticky-job-summary" :class="{show: scrolled}">
          <div class="sjs-info">
            <span class="sjs-title" x-text="detail.job.title"></span>
            <span class="sjs-sep">·</span>
            <span class="sjs-company" x-text="detail.company?.name || detail.job.company_name || '未知'"></span>
            <span class="sjs-sep">·</span>
            <span class="sjs-salary" x-text="detail.job.salary?.raw || '面议'"></span>
            <span class="sjs-sep">·</span>
            <span class="sjs-city" x-text="detail.job.city || ''"></span>
            <template x-if="detail.rule_score">
              <span class="sjs-score">
                <span class="sjs-sep">·</span>
                <span class="badge" :class="detail.rule_score.status.toLowerCase()" x-text="detail.rule_score.status"></span>
                <span class="sjs-total" x-text="(detail.rule_score.total_score || 0).toFixed(1) + '/10'"></span>
              </span>
            </template>
          </div>
          <div class="sjs-actions" x-show="scrolled">
            <button class="primary" @click="triggerAiScore()" :disabled="taskRunning('ai-score-' + selectedJobId + '-' + aiProvider)"><i data-lucide="bot"></i><span>打分</span></button>
            <button @click="triggerAiScore(true)" :disabled="taskRunning('ai-score-' + selectedJobId + '-' + aiProvider)"><i data-lucide="file-text"></i><span>深度</span></button>
            <button title="实验性功能：简历优化尚未充分测试，欢迎反馈改进" @click="triggerResume()" :disabled="taskRunning('resume-' + selectedJobId + '-' + aiProvider)"><i data-lucide="file-text"></i><span>简历</span></button>
            <button @click="toggleFavorite(selectedJobId, !detail.job.favorite)" :class="{primary: detail.job.favorite}"><i data-lucide="star" :fill="detail.job.favorite ? 'currentColor' : 'none'"></i><span x-text="detail.job.favorite ? '已藏' : '收藏'"></span></button>
            <button @click="toggleIgnore(selectedJobId, !detail.job.ignored)" :class="{primary: detail.job.ignored}"><i data-lucide="eye-off"></i><span x-text="detail.job.ignored ? '已忽略' : '忽略'"></span></button>
            <button class="danger" @click="if(confirm('确认删除职位「' + detail.job.title + '」? 此操作不可恢复')) deleteJob(selectedJobId)"><i data-lucide="trash-2"></i><span>删除</span></button>
          </div>
        </div>
        <div class="detail-layout">
        <nav class="section-nav">
          <a class="nav-link" :class="{active: activeSection==='sec-basic'}" @click="scrollToSection('sec-basic')"><i data-lucide="info"></i>基础信息</a>

          <a class="nav-link" :class="{active: activeSection==='sec-manual'}" @click="scrollToSection('sec-manual')"><i data-lucide="hand"></i>人工调分</a>
          <a class="nav-link" :class="{active: activeSection==='sec-ai'}" @click="scrollToSection('sec-ai')" x-show="detail.ai_scores && detail.ai_scores.length"><i data-lucide="bot"></i>AI打分</a>
          <a class="nav-link" :class="{active: activeSection==='sec-jd'}" @click="scrollToSection('sec-jd')"><i data-lucide="file-text"></i>岗位描述</a>
          <a class="nav-link" :class="{active: activeSection==='sec-company'}" @click="scrollToSection('sec-company')" x-show="detail.company && detail.company.intro"><i data-lucide="building-2"></i>公司简介</a>

        <div class="detail-content-inner">

              <i data-lucide="refresh-cw"></i><span>需重打</span>

            <select x-model="aiProvider" style="min-width:100px">
              <template x-for="p in providers" :key="p">
                <option :value="p" x-text="p"></option>
              </template>
            </select>
            <button class="primary" @click="triggerAiScore()" :disabled="taskRunning('ai-score-' + selectedJobId + '-' + aiProvider)">
              <i data-lucide="bot"></i>
              <span x-show="!taskRunning('ai-score-' + selectedJobId + '-' + aiProvider)">打分</span>

            <button @click="triggerAiScore(true)" :disabled="taskRunning('ai-score-' + selectedJobId + '-' + aiProvider)"><i data-lucide="file-text"></i><span>深度</span></button>
            <button title="实验性功能：简历优化尚未充分测试，欢迎反馈改进" @click="triggerResume()" :disabled="taskRunning('resume-' + selectedJobId + '-' + aiProvider)"><i data-lucide="file-text"></i><span>简历</span></button>
            <button @click="toggleFavorite(selectedJobId, !detail.job.favorite)" :class="{primary: detail.job.favorite}"><i data-lucide="star" :fill="detail.job.favorite ? 'currentColor' : 'none'"></i><span x-text="detail.job.favorite ? '已藏' : '收藏'"></span></button>
            <button @click="toggleIgnore(selectedJobId, !detail.job.ignored)" :class="{primary: detail.job.ignored}"><i data-lucide="eye-off"></i><span x-text="detail.job.ignored ? '已忽略' : '忽略'"></span></button>
            <button class="danger" @click="if(confirm('确认删除职位「' + detail.job.title + '」? 此操作不可恢复')) deleteJob(selectedJobId)"><i data-lucide="trash-2"></i><span>删除</span></button>

        <div class="detail-subtitle">

          <span class="sep">·</span>

        <!-- 基础信息卡片 -->
        <div class="detail-section" id="sec-basic">
          <div class="card-header">

              <i data-lucide="info"></i>

          </div>
          <div class="info-grid">
            <div class="info-item"><span class="label">公司</span><span class="info-value" x-text="detail.company?.name || detail.job.company_name || '未知'"></span></div>
            <div class="info-item"><span class="label">行业</span><span class="info-value" x-text="detail.company?.industry || '-'"></span></div>
            <div class="info-item"><span class="label">薪资</span><span class="info-value salary" style="color:var(--gaj-state-orange);font-weight:600" x-text="detail.job.salary?.raw || '面议'"></span></div>
            <div class="info-item"><span class="label">城市</span><span class="info-value" x-text="detail.job.city + (detail.job.district ? ' ' + detail.job.district : '')"></span></div>
            <div class="info-item"><span class="label">经验</span><span class="info-value" x-text="detail.job.experience?.raw || '不限'"></span></div>
            <div class="info-item"><span class="label">学历</span><span class="info-value" x-text="detail.job.education?.raw || '不限'"></span></div>
            <div class="info-item"><span class="label">规模</span><span class="info-value" x-text="detail.company?.scale_raw || '-'"></span></div>
            <div class="info-item"><span class="label">阶段</span><span class="info-value" x-text="detail.company?.stage || '-'"></span></div>
            <div class="info-item" style="grid-column: 1 / -1"><span class="label">技能</span><span class="info-value" x-text="(detail.job.skills || []).join(', ') || '-'"></span></div>
            <div class="info-item" style="grid-column: 1 / -1"><span class="label">福利</span><span class="info-value" x-text="(detail.job.welfare || []).join(', ') || '-'"></span></div>
            <div class="info-item" style="grid-column: 1 / -1"><span class="label">地址</span><span class="info-value" x-text="detail.job.address || '-'"></span></div>
            <div class="info-item">
              <span class="label">坐标</span>
              <template x-if="detail.job.gps">
                <span class="info-value" style="color:var(--gaj-foreground-2);font-size:var(--gaj-font-size-xs)" x-text="detail.job.gps.lng + ', ' + detail.job.gps.lat"></span>
              </template>
              <template x-if="!detail.job.gps">
                <span style="color:var(--gaj-foreground-3)">未记录</span>
              </template>
            </div>
          </div>
        </div>

        <!-- Rule Score -->
        <div class="detail-section" id="sec-rule" x-show="detail.rule_score">
          <div class="card-header">
            <div class="card-title">
              <i data-lucide="bar-chart-3"></i>
              <span>规则打分</span>
            </div>
            <span class="card-hint" x-text="detail.rule_score.rules_version ? 'v' + detail.rule_score.rules_version : ''"></span>
          </div>
          <div class="score-card">
            <div class="score-summary">
              <div class="header-row">
                <span class="badge" :class="detail.rule_score.status.toLowerCase()" x-text="detail.rule_score.status"></span>
                <span class="total" x-text="(detail.rule_score.total_score || 0).toFixed(1) + '/10'"></span>
                <span style="color:var(--gaj-foreground-3);font-size:var(--gaj-font-size-sm)" x-text="'(' + (detail.rule_score.total_100 || 0).toFixed(0) + '分)'"></span>
              </div>
            </div>
            <!-- 维度条形图 -->
            <div class="dim-bars">
              <template x-for="(val, key) in detail.rule_score.dimension_scores || {}" :key="key">
                <div class="dim-bar-row">
                  <span class="lbl" x-text="{finance:'财务',growth:'成长',resource:'资源',wlb:'WLB'}[key] || key"></span>
                  <div class="dim-bar-track">
                    <div class="dim-bar-fill" :style="'width:' + Math.min(100, (val || 0) * 10) + '%; background:' + ((val || 0) >= 8 ? 'var(--gaj-state-success)' : ((val || 0) >= 6 ? 'var(--gaj-state-warning)' : 'var(--gaj-state-error)'))"></div>
                  </div>
                  <span class="val" x-text="(val || 0).toFixed(1)"></span>
                </div>
              </template>
            </div>
            <!-- Hard Checks (只展示命中的) -->
            <template x-if="detail.rule_score.hard_checks && detail.rule_score.hard_checks.filter(h => h.hit).length">
              <div class="hard-checks-list">
                <div class="hc-title">命中规则明细</div>
                <template x-for="hc in detail.rule_score.hard_checks.filter(h => h.hit)" :key="hc.code">
                  <div class="hard-check-item" :class="{'fatal': hc.fatal, 'suspicion': !hc.fatal}">
                    <div class="hc-header">
                      <span class="hc-code" x-text="hc.code"></span>
                      <span class="hc-label" x-text="hc.label"></span>
                      <span class="hc-verdict">
                        <span x-show="hc.fatal" style="display:inline-flex;align-items:center;gap:3px;"><i data-lucide="x-circle"></i>淘汰</span>
                        <span x-show="!hc.fatal" style="display:inline-flex;align-items:center;gap:3px;"><i data-lucide="help-circle"></i>存疑→AI</span>
                      </span>
                    </div>
                    <div class="hc-reason" x-text="hc.reason"></div>
                    <div class="hc-confidence" x-show="hc.confidence < 1.0">
                      置信度 <span x-text="(hc.confidence*100).toFixed(0) + '%'"></span>
                      <span x-text="hc.confidence >= hc.floor ? '≥' : '<'"></span>
                      下限 <span x-text="(hc.floor*100).toFixed(0) + '%'"></span>
                    </div>
                    <template x-if="hc.evidence && hc.evidence.length">
                      <div class="hc-evidence">
                        证据: <span x-text="hc.evidence.join('、')"></span>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
            <div style="margin-top:8px;font-size:var(--gaj-font-size-xs);color:var(--gaj-foreground-2);display:flex;align-items:center;gap:4px;" x-show="detail.rule_score.reject_reason">
              <i data-lucide="alert-circle" style="color:var(--gaj-state-error)"></i>
              <span style="color:var(--gaj-state-error)">淘汰: </span><span x-text="detail.rule_score.reject_reason"></span>
            </div>
            <template x-for="w in detail.rule_score.warnings || []" :key="w">
              <div style="font-size:var(--gaj-font-size-xs);color:var(--gaj-state-warning);margin-top:4px;display:flex;align-items:center;gap:4px;">
                <i data-lucide="alert-triangle"></i><span x-text="w"></span>
              </div>
            </template>
            <template x-for="t in detail.rule_score.triggered_ai_rules || []" :key="t.code">
              <div style="font-size:var(--gaj-font-size-xs);color:var(--gaj-state-purple);margin-top:4px;display:flex;align-items:center;gap:4px;">
                <i data-lucide="arrow-right"></i><strong x-text="t.code"></strong> <span x-text="t.reason"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- Manual Override -->
        <div class="detail-section" id="sec-manual">
          <div class="card-header">
            <div class="card-title">
              <i data-lucide="hand"></i>
              <span>人工调分</span>
            </div>
          </div>
          <div class="manual-override-box">
            <template x-if="detail.job.manual_override && detail.job.manual_override.total !== undefined && detail.job.manual_override.total !== null">
              <div class="manual-current">
                <span>当前人工调分: <strong style="color:var(--gaj-state-orange);font-size:var(--gaj-font-size-lg)" x-text="(detail.job.manual_override.total || 0).toFixed(1) + ' 分'"></strong></span>
                <span style="color:var(--gaj-foreground-3);margin-left:8px" x-text="detail.job.manual_override.at ? '于 ' + detail.job.manual_override.at : ''"></span>
                <div class="manual-note-display" x-show="detail.job.manual_override.note" x-text="'备注: ' + detail.job.manual_override.note"></div>
              </div>
            </template>
            <div class="manual-edit-row">
              <label>调整分数:</label>
              <input type="number" step="0.1" min="0" max="100" style="width:80px"
                     x-model="manualEdit.total"
                     :placeholder="detail.job.manual_override && detail.job.manual_override.total != null ? detail.job.manual_override.total.toFixed(1) : '如 7.5'">
              <label style="margin-left:8px">备注:</label>
              <input type="text" style="flex:1;min-width:200px"
                     x-model="manualEdit.note"
                     placeholder="如: 条件太苛刻实际可接受 / 简历没写充分其实匹配 / ...">
              <button class="primary" @click="saveManualOverride()" :disabled="manualSaving">
                <i data-lucide="save"></i>
                <span x-show="!manualSaving">保存</span>
                <span x-show="manualSaving">⏳</span>
              </button>
              <button @click="clearManualOverride()" x-show="detail.job.manual_override && detail.job.manual_override.total != null" class="danger">
                <i data-lucide="x"></i><span>清除</span>
              </button>
            </div>
            <div style="font-size:var(--gaj-font-size-xs);color:var(--gaj-foreground-3);margin-top:6px">
              人工调分会覆盖 AI/规则分用于排序。备注会在后续生成简历时引用。
            </div>
          </div>
        </div>

        <!-- AI Scores -->
        <div class="detail-section" id="sec-ai" x-show="detail.ai_scores && detail.ai_scores.length > 0">
          <div class="card-header">
            <div class="card-title">
              <i data-lucide="bot" style="color: var(--gaj-state-purple);"></i>
              <span>AI 打分</span>
            </div>
            <span class="card-hint" x-text="detail.ai_scores.length + ' 次'"></span>
          </div>
          <!-- 分数轨迹: 预期调整前后分数的变化一目了然 -->
          <div class="ai-sparkline" x-data="{sp: null}"
               x-effect="detail; sp = (detail && detail.ai_scores) ? sparklineData(detail.ai_scores) : null"
               x-show="sp && sp.dots.length >= 2">
            <div class="spark-title">
              <i data-lucide="trending-up"></i>
              <span>分数轨迹</span>
              <span class="spark-count" x-show="sp" x-text="sp ? sp.dots.length + ' 次打分, 左旧右新' : ''"></span>
            </div>
            <svg :viewBox="'0 0 ' + (sp ? sp.w : 240) + ' 56'" class="spark-svg" preserveAspectRatio="none" x-show="sp">
              <polyline :points="sp ? sp.points : ''" class="spark-line"></polyline>
              <g x-html="sp ? sparkDotsSvg(sp) : ''"></g>
            </svg>
          </div>
          <template x-for="s in detail.ai_scores" :key="s._file || s.created_at">
            <div class="ai-score-section">
              <div class="header-row">
                <span class="provider" x-text="'🤖 ' + s.provider"></span>
                <span class="badge" :class="s.status.toLowerCase()" x-text="s.status"></span>
                <template x-if="s.status !== 'PARSE_FAILED'">
                  <span class="total" style="font-size:var(--gaj-font-size-lg)" x-text="(s.total_score || 0).toFixed(1) + '/10'"></span>
                </template>
                <template x-if="s.status !== 'PARSE_FAILED'">
                  <span class="badge ai" x-text="s.recommendation"></span>
                </template>
                <span style="color:var(--gaj-foreground-3);margin-left:auto;font-size:var(--gaj-font-size-xs)" x-text="s.created_at"></span>
                <button class="danger" style="padding:4px 10px;font-size:var(--gaj-font-size-xs)" @click="deleteAiScore(s._file)"><i data-lucide="trash-2"></i></button>
              </div>
              <!-- 解析失败: 显示编辑入口 -->
              <template x-if="s.status === 'PARSE_FAILED'">
                <div class="parse-failed-box">
                  <div style="color:var(--gaj-state-warning);font-size:var(--gaj-font-size-sm);margin-bottom:6px;display:flex;align-items:center;gap:4px;">
                    <i data-lucide="alert-triangle"></i> JSON 解析失败, 可人工编辑后重新解析
                  </div>
                  <textarea x-model="s._edit_text" class="raw-edit-textarea" placeholder="编辑 AI 原始回复..." x-init="s._edit_text = s._edit_text || s.raw_response || ''"></textarea>
                  <div style="margin-top:6px;display:flex;gap:6px">
                    <button class="primary" style="padding:4px 12px;font-size:var(--gaj-font-size-xs)" @click="reparseAi(job_id_for_detail(), s._file)" :disabled="reparseFile === s._file">
                      <i data-lucide="refresh-cw"></i>
                      <span x-show="reparseFile !== s._file">重新解析</span>
                      <span x-show="reparseFile === s._file">解析中</span>
                    </button>
                  </div>
                </div>
              </template>
              <!-- 解析成功: 正常展示 -->
              <template x-if="s.status !== 'PARSE_FAILED'">
                <div>
                  <div class="dims">
                    <template x-for="key in ['finance','growth','resource','wlb']" :key="key">
                      <div class="dim">
                        <span class="lbl" x-text="{finance:'财务',growth:'成长',resource:'资源',wlb:'WLB'}[key]"></span>
                        <div class="dim-bar-track">
                          <div class="dim-bar-fill" :style="'width:' + Math.min(100, ((s.dimension_scores || {})[key] || 0) * 10) + '%; background:' + (((s.dimension_scores || {})[key] || 0) >= 8 ? 'var(--gaj-state-success)' : (((s.dimension_scores || {})[key] || 0) >= 6 ? 'var(--gaj-primary)' : 'var(--gaj-state-warning)'))"></div>
                        </div>
                        <span class="val" x-text="((s.dimension_scores || {})[key] || 0).toFixed(1)"></span>
                      </div>
                    </template>
                  </div>
                  <div class="reason" x-show="s.recommendation_reason" x-text="s.recommendation_reason"></div>
                  <div class="tags">
                    <template x-for="h in s.highlights || []" :key="h">
                      <div class="tag highlight"><i data-lucide="plus"></i><span x-text="h"></span></div>
                    </template>
                    <template x-for="r in s.risks || []" :key="r">
                      <div class="tag risk"><i data-lucide="alert-triangle"></i><span x-text="r"></span></div>
                    </template>
                    <template x-for="t in s.interview_tips || []" :key="t">
                      <div class="tag tip"><i data-lucide="lightbulb"></i><span x-text="t"></span></div>
                    </template>
                  </div>
                  <div class="reason" x-show="s.deep_analysis_report" style="white-space:pre-wrap;border-top:1px solid var(--gaj-border);padding-top:8px;margin-top:8px" x-text="s.deep_analysis_report"></div>
                  <!-- 查看原始回复 + 重新解析 -->
                  <div style="margin-top:8px;border-top:1px solid var(--gaj-border);padding-top:8px">
                    <button style="font-size:var(--gaj-font-size-xs);padding:4px 10px;background:var(--gaj-surface-2);border:1px solid var(--gaj-border);border-radius:var(--gaj-radius-sm);color:var(--gaj-foreground-2);cursor:pointer;display:inline-flex;align-items:center;gap:4px;" @click="reparseExpand = (reparseExpand === s._file ? '' : s._file)">
                      <i data-lucide="file-text"></i>
                      <span x-show="reparseExpand !== s._file">查看原始回复</span>
                      <span x-show="reparseExpand === s._file">收起</span>
                    </button>
                    <template x-if="reparseExpand === s._file">
                      <div style="margin-top:6px">
                        <textarea x-model="s._edit_text" class="raw-edit-textarea" placeholder="编辑 AI 原始回复..." x-init="s._edit_text = s._edit_text || s.raw_response || ''"></textarea>
                        <div style="margin-top:6px;display:flex;gap:6px">
                          <button class="primary" style="padding:4px 12px;font-size:var(--gaj-font-size-xs)" @click="reparseAi(job_id_for_detail(), s._file)" :disabled="reparseFile === s._file">
                            <i data-lucide="refresh-cw"></i>
                            <span x-show="reparseFile !== s._file">重新解析</span>
                            <span x-show="reparseFile === s._file">解析中</span>
                          </button>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>

        <!-- JD -->
        <div class="detail-section" id="sec-jd">
          <div class="card-header">
            <div class="card-title">
              <i data-lucide="file-text"></i>
              <span>岗位描述</span>
            </div>
          </div>
          <div class="jd-text" x-text="detail.jd_text || detail.job.jd?.full || '无 JD'"></div>
        </div>

        <!-- Company -->
        <div class="detail-section" id="sec-company" x-show="detail.company && detail.company.intro">
          <div class="card-header">
            <div class="card-title">
              <i data-lucide="building-2"></i>
              <span>公司简介</span>
            </div>
          </div>
          <div class="jd-text" x-text="detail.company?.intro || ''"></div>
        </div>
        </div>
        </div>
      </div>
      </template>
    </div>
  </div>

  <!-- Company Detail Drawer (公司详情抽屉) -->
  <div class="drawer-mask" x-show="companyDetail || companyDetailLoading" x-cloak
       @click="closeCompany()" x-transition.opacity></div>
  <div class="company-drawer" x-show="companyDetail || companyDetailLoading" x-cloak x-transition>
    <div class="loading" x-show="companyDetailLoading" style="padding:32px;">加载中...</div>
    <template x-if="companyDetail && !companyDetailLoading">
      <div class="cd-body" x-data="{introExpanded: false}">
        <div class="cd-header">
          <span class="tier-badge lg" :class="tierClass(companyDetail.stats?.rank_tier)"
                x-show="companyDetail.stats?.rank_tier" x-text="companyDetail.stats?.rank_tier"></span>
          <h2 x-text="companyDetail.company.name"></h2>
          <button class="cd-close" @click="closeCompany()"><i data-lucide="x"></i></button>
        </div>
        <div class="cd-score-row">
          <span class="cd-score" x-text="companyDetail.stats?.company_score != null ? companyDetail.stats.company_score.toFixed(1) : '?'"></span>
          <span class="cd-score-cap">/10 公司分</span>
          <span class="cd-sub" x-show="companyDetail.stats?.ai_scored_count > 0"
                x-text="'已鉴定 ' + companyDetail.stats.ai_scored_count + ' 个岗位'"></span>
          <button class="gc-fav big" :class="{on: companyDetail.company.favorite}"

            <i data-lucide="heart" :fill="companyDetail.company.favorite ? 'currentColor' : 'none'"></i>
            <span x-text="companyDetail.company.favorite ? '已想去' : '想去'"></span>
          </button>
          <button class="compare-btn" :class="{on: compareIds.includes(companyDetail.company.brand_id)}"
                  @click="toggleCompare(companyDetail.company.brand_id)">
            <i data-lucide="scale"></i>
            <span x-text="compareIds.includes(companyDetail.company.brand_id) ? '已在对比' : '加入对比'"></span>
          </button>
        </div>
        <div class="cd-chips">
          <span x-show="companyDetail.company.industry" x-text="companyDetail.company.industry"></span>
          <span x-show="companyDetail.company.stage" x-text="companyDetail.company.stage"></span>
          <span x-show="companyDetail.company.scale_raw" x-text="companyDetail.company.scale_raw"></span>
          <span x-show="companyDetail.company.nature && companyDetail.company.nature !== '未知'" x-text="companyDetail.company.nature"></span>
          <span x-show="companyDetail.company.founded" x-text="'成立于 ' + companyDetail.company.founded"></span>
          <span x-show="companyDetail.company.hours_per_day" x-text="'日均 ' + companyDetail.company.hours_per_day + 'h'"></span>
          <span x-text="'在招 ' + (companyDetail.stats?.job_count || 0) + ' 岗'"></span>

        </div>
        <div class="cd-section" x-show="companyDetail.company.intro">
          <div class="cd-h"><i data-lucide="building-2"></i>公司简介</div>
          <div class="cd-text" :class="{clamped: !introExpanded}" x-text="companyDetail.company.intro"></div>
          <button class="cd-more" @click="introExpanded = !introExpanded"
                  x-text="introExpanded ? '收起' : '展开全文'"></button>

        <div class="cd-section" x-show="companyDetail.company.business_scope">
          <div class="cd-h"><i data-lucide="compass"></i>经营范围</div>

            <line x1="100" y1="30" x2="100" y2="170" class="radar-frame"></line>
            <line x1="30" y1="100" x2="170" y2="100" class="radar-frame"></line>
            <polygon :points="radarPoints(companyDetail.dims_avg, 100, 100, 70)" class="radar-shape"></polygon>
            <text x="100" y="20" class="radar-label" text-anchor="middle">财务</text>
            <text x="178" y="104" class="radar-label" text-anchor="start">成长</text>
            <text x="100" y="190" class="radar-label" text-anchor="middle">资源</text>
            <text x="22" y="104" class="radar-label" text-anchor="end">WLB</text>
          </svg>
        </div>
        <div class="cd-section">
          <div class="cd-h">
            <i data-lucide="sparkles" style="color: var(--gaj-state-purple);"></i>
            AI 评价 · 图鉴词条
            <span class="cd-h-hint" x-show="(companyDetail.ai_scores || []).length > 1"

            <select class="filter-select" x-model="aiProvider" style="width:auto;">
              <template x-for="p in providers" :key="p">
                <option :value="p" x-text="p"></option>
              </template>
            </select>
            <button class="primary" @click="analyzeCompany(companyDetail.company.brand_id)"
                    :disabled="taskRunning('company-analyze-' + companyDetail.company.brand_id)">
              <i data-lucide="sparkles"></i>
              <span x-show="!taskRunning('company-analyze-' + companyDetail.company.brand_id)"

          <template x-if="(companyDetail.ai_scores || []).length">

                <button class="cd-ai-del" style="margin-left:auto;"

              </div>

              <div class="cd-ai-body" x-show="companyDetail.ai_scores[0].tech_stack_profile">

              </div>
              <div class="cd-ai-line">
                <span class="cd-ai-k">招聘紧迫度</span>
                <span class="cd-ai-v" x-text="companyDetail.ai_scores[0].hiring_urgency + (companyDetail.ai_scores[0].hiring_urgency_reason ? ' — ' + companyDetail.ai_scores[0].hiring_urgency_reason : '')"></span>
              </div>
              <div class="cd-ai-line" x-show="companyDetail.ai_scores[0].worth_joining_reason">
                <span class="cd-ai-k">结论理由</span>
                <span class="cd-ai-v" x-text="companyDetail.ai_scores[0].worth_joining_reason"></span>
              </div>
              <div class="cd-ai-line" x-show="(companyDetail.ai_scores[0].highlights || []).length">
                <span class="cd-ai-k">亮点</span>
                <span class="cd-ai-v">
                  <template x-for="(t, ti) in companyDetail.ai_scores[0].highlights" :key="ti">
                    <span class="cd-ai-chip hl" x-text="t"></span>
                  </template>
                </span>
              </div>
              <div class="cd-ai-line" x-show="(companyDetail.ai_scores[0].risks || []).length">
                <span class="cd-ai-k">顾虑</span>
                <span class="cd-ai-v">
                  <template x-for="(t, ti) in companyDetail.ai_scores[0].risks" :key="ti">
                    <span class="cd-ai-chip risk" x-text="t"></span>
                  </template>
                </span>
              </div>
              <div class="cd-ai-line" x-show="(companyDetail.ai_scores[0].interview_strategy || []).length">
                <span class="cd-ai-k">面试策略</span>
                <span class="cd-ai-v">
                  <template x-for="(t, ti) in companyDetail.ai_scores[0].interview_strategy" :key="ti">
                    <span class="cd-ai-chip tip" x-text="t"></span>
                  </template>
                </span>
              </div>
              <div class="cd-ai-kws" x-show="(companyDetail.ai_scores[0].business_keywords || []).length">
                <template x-for="(k, ki) in companyDetail.ai_scores[0].business_keywords" :key="ki">
                  <span class="cd-kw" x-text="k"></span>
                </template>
              </div>
              <div class="cd-ai-history" x-show="companyDetail.ai_scores.length > 1">
                <div class="cd-ai-h-h">历史评价</div>
                <template x-for="s in companyDetail.ai_scores.slice(1)" :key="s._file">
                  <div class="cd-ai-h-item">
                    <span class="badge ai" x-text="s.provider"></span>
                    <span x-text="s.created_at"></span>
                    <span x-text="s.worth_joining"></span>
                    <span x-text="s.company_score_ai != null ? s.company_score_ai.toFixed(1) + '/10' : '?'"></span>
                    <button class="cd-ai-del" @click="deleteCompanyAiScore(s._file)" title="删除">
                      <i data-lucide="trash-2"></i>
                    </button>
                  </div>
                </template>
              </div>
            </div>
          </template>
          <div class="cd-empty"
               x-show="!(companyDetail.ai_scores || []).length && !taskRunning('company-analyze-' + companyDetail.company.brand_id)">
            还没有评价。点击「生成 AI 评价」, 让大模型基于公司资料与全部在招岗位生成词条:
            业务解读 / 技术栈画像 / 招聘紧迫度 / 值不值得去 / 面试策略。
          </div>
        </div>
        <div class="cd-section">
          <div class="cd-h"><i data-lucide="briefcase"></i>名下岗位 (<span x-text="companyDetail.job_count"></span>)</div>
          <div class="cd-empty" x-show="companyDetail.job_count === 0">暂无岗位记录</div>
          <template x-for="j in companyDetail.jobs" :key="j.job_id">
            <div class="cd-job" @click="openJobFromCompany(j.job_id)" title="点击查看职位详情">
              <div class="cd-job-title">
                <span x-text="j.title"></span>
                <i data-lucide="arrow-right"></i>
              </div>
              <div class="cd-job-meta">
                <span class="salary" x-text="j.salary_raw || '面议'"></span>
                <span x-show="j.city" x-text="j.city"></span>
                <span class="score-label" :class="(j.rule_status || 'none').toLowerCase()"
                      x-text="j.best_total != null ? j.best_total.toFixed(1) + ' 分' : '未打分'"></span>
                <span class="badge ai" x-show="j.ai_count > 0" x-text="'AI×' + j.ai_count"></span>
                <span class="badge" style="opacity:.7" x-show="!j.online">已下线</span>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- Log Panel -->
  <div class="log-panel" :class="{collapsed: logCollapsed}">
    <div class="log-header" @click="logCollapsed = !logCollapsed">
      <span class="title"><i data-lucide="terminal"></i>实时日志</span>
      <span class="count" x-text="logs.length"></span>
      <span style="margin-left:auto;font-size:var(--gaj-font-size-xs);display:inline-flex;align-items:center;gap:4px;" x-show="!sseConnected">
        <i data-lucide="alert-circle" style="color:var(--gaj-state-warning)"></i><span style="color:var(--gaj-state-warning)">未连接</span>
      </span>
      <span style="margin-left:auto;font-size:var(--gaj-font-size-xs);display:inline-flex;align-items:center;gap:4px;" x-show="sseConnected">
        <span style="width:8px;height:8px;background:var(--gaj-state-success);border-radius:50%;display:inline-block;"></span>
        <span style="color:var(--gaj-state-success)">已连接</span>
      </span>
    </div>
    <div class="log-body" x-ref="logBody">
      <template x-for="(line, i) in logs.slice(-200)" :key="i">
        <div class="log-line">
          <span class="ts" x-text="new Date(line.ts * 1000).toLocaleTimeString()"></span>
          <span class="lvl" :class="line.level" x-text="line.level"></span>
          <span class="msg" x-text="line.message"></span>
        </div>
      </template>
    </div>
  </div>

</div>

<script>
  // Lucide 图标刷新: 用重入保护 + 防抖, 避免与 Alpine/自身 DOM 变化形成死循环
  let _iconRefreshing = false;
  let _iconRefreshTimer = null;
  function refreshIcons() {
    if (_iconRefreshing) return;
    if (!window.lucide || !window.lucide.createIcons) return;
    _iconRefreshing = true;
    try { window.lucide.createIcons(); } catch(e) {}
    _iconRefreshing = false;
  }
  // 防抖版本: 供 Alpine x-init 调用, 合并多次数据变化
  function refreshIconsDebounced() {
    if (_iconRefreshTimer) clearTimeout(_iconRefreshTimer);
    _iconRefreshTimer = setTimeout(refreshIcons, 50);
  }
  window.refreshIconsDebounced = refreshIconsDebounced;
  // 初次渲染
  document.addEventListener('DOMContentLoaded', refreshIconsDebounced);
  // Alpine 初始化完成
  document.addEventListener('alpine:initialized', refreshIconsDebounced);
</script>

</body>
</html>
