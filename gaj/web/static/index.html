<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get A Job — 个人猎头</title>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body x-data="app()" x-init="init()">

<!-- Toast 通知容器 -->
<div class="toast-container">
  <template x-for="t in toasts" :key="t.id">
    <div class="toast" :class="t.type" x-text="t.msg" @click="removeToast(t.id)"></div>
  </template>
</div>

<!-- Header -->
<div class="header">
  <h1>🎯 Get A Job</h1>
  <div class="stats">
    <span>📊 <strong x-text="stats.total || 0"></strong> 职位</span>
    <span>✓ <strong x-text="stats.scored_rule || 0"></strong> 规则打分</span>
    <span>🤖 <strong x-text="stats.scored_ai || 0"></strong> AI 打分</span>
    <span>⏳ <strong x-text="stats.unscored || 0"></strong> 未打分</span>
    <span>★ <strong x-text="stats.favorite || 0"></strong> 收藏</span>
    <span x-show="stats.ignored > 0">🚫 <strong x-text="stats.ignored || 0"></strong> 已忽略</span>
  </div>
  <div class="actions">
    <button @click="selectMode = !selectMode; if(!selectMode) clearSelection()" :class="{primary: selectMode}">
      <span x-show="!selectMode">☑️ 批量</span>
      <span x-show="selectMode">✕ 退出批量</span>
    </button>
    <button @click="showConfig = !showConfig; if(showConfig) configTab='rules'" :class="{primary: showConfig}">⚙️ 规则配置</button>
    <button @click="showResume = !showResume" :class="{primary: showResume}">
      <span x-show="!resumeData.exists">📄 上传简历</span>
      <span x-show="resumeData.exists">📄 简历已上传</span>
    </button>
    <button @click="scoreAll()" :disabled="taskRunning('score-all')" class="primary">
      <span x-show="!taskRunning('score-all')">⚡ 规则打分</span>
      <span x-show="taskRunning('score-all')">⏳ 打分中...</span>
    </button>
  </div>
</div>

<!-- Config Panel -->
<div class="config-panel" x-show="showConfig" x-cloak>
  <div class="config-tabs">
    <button :class="{active: configTab==='rules'}" @click="configTab='rules'">📋 规则概览</button>
    <button :class="{active: configTab==='profile'}" @click="configTab='profile'">✏️ 画像编辑</button>
    <button @click="showConfig=false" style="margin-left:auto">✕ 关闭</button>
  </div>

  <!-- Tab: 规则概览 -->
  <div x-show="configTab==='rules'" class="config-body">
    <template x-if="rulesCatalog">
      <div>
        <div class="config-meta">
          <span>规则版本: <strong x-text="rulesCatalog.version"></strong></span>
          <span>权重来源: <strong x-text="rulesCatalog.weights_source"></strong></span>
          <span>当前淘汰置信度下限:
            <input type="number" step="0.1" min="0" max="1" class="rule-max-input"
                   :value="rulesEdit.reject_confidence_floor != null ? rulesEdit.reject_confidence_floor : rulesCatalog.default_reject_confidence_floor"
                   @input="rulesEdit.reject_confidence_floor = parseFloat($event.target.value)"
                   style="width:50px">
            <span class="rule-default" @click="rulesEdit.reject_confidence_floor = null"
                  x-text="'↺ 默认'+(rulesCatalog.default_reject_confidence_floor*100)+'%'"></span>
            (证据置信度低于此值只标 REVIEW 不淘汰)
          </span>
        </div>

        <div class="profile-actions" style="margin-bottom: 12px;">
          <button class="primary" @click="saveScoringConfig()" :disabled="rulesSaving">
            <span x-show="!rulesSaving">💾 保存规则参数</span>
            <span x-show="rulesSaving">⏳ 保存中...</span>
          </button>
          <button @click="resetRulesEdit()">↩️ 重置为加载时值</button>
          <button @click="resetAllRulesDefault()">🔄 全部恢复默认</button>
          <span style="color:var(--text3);font-size:12px">保存后请点击"规则打分"重新评分</span>
        </div>

        <h3 class="config-h">🚫 硬性淘汰规则 (命中即淘汰, 证据不足只标 REVIEW)</h3>
        <div class="rule-grid">
          <template x-for="h in rulesCatalog.hard_checks" :key="h.code">
            <div class="rule-card reject">
              <div class="rule-code" x-text="h.code"></div>
              <div class="rule-label" x-text="h.label"></div>
              <div class="rule-detail" x-text="h.detail"></div>
            </div>
          </template>
        </div>

        <h3 class="config-h">📊 四维度评分 (改满分后按比例缩放, 加权求和得总分)</h3>
        <template x-for="dim in rulesCatalog.dimensions" :key="dim.key">
          <div class="dim-block">
            <div class="dim-header">
              <strong x-text="dim.label"></strong>
              <span class="dim-max" x-text="'当前满分 '+dimMaxSum(dim)+' / 默认 '+dim.default_max_score"></span>
            </div>
            <div class="rule-grid">
              <template x-for="item in dim.items" :key="item.code">
                <div class="rule-card" :class="{changed: rulesEdit[item.override_key] != null && rulesEdit[item.override_key] !== item.default_max}">
                  <div class="rule-code" x-text="item.code"></div>
                  <div class="rule-label" x-text="item.label"></div>
                  <div class="rule-detail" x-text="item.detail"></div>
                  <div class="rule-max-row">
                    <label>满分:</label>
                    <input type="number" step="0.1" min="0" max="100" class="rule-max-input"
                           :value="rulesEdit[item.override_key] != null ? rulesEdit[item.override_key] : item.default_max"
                           @input="rulesEdit[item.override_key] = parseFloat($event.target.value)">
                    <span class="rule-default" @click="rulesEdit[item.override_key] = null"
                          x-text="'↺'+item.default_max"></span>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>

        <h3 class="config-h">🤖 AI 介入触发条件 (规则力所不及时交给大模型)</h3>
        <div class="rule-grid">
          <template x-for="a in rulesCatalog.ai_triggers" :key="a.code">
            <div class="rule-card ai">
              <div class="rule-code" x-text="a.code"></div>
              <div class="rule-label" x-text="a.label"></div>
              <div class="rule-detail" x-text="a.detail"></div>
            </div>
          </template>
        </div>
      </div>
    </template>
    <div x-show="!rulesCatalog" class="loading">加载规则中...</div>
  </div>

  <!-- Tab: 画像编辑 -->
  <div x-show="configTab==='profile'" class="config-body">
    <template x-if="profileData">
      <div>
        <div class="config-meta">
          <span>当前权重(归一化): <strong x-text="profileData.weights ? '财务'+(profileData.weights.finance*100).toFixed(0)+'% / 成长'+(profileData.weights.growth*100).toFixed(0)+'% / 资源'+(profileData.weights.resource*100).toFixed(0)+'% / WLB'+(profileData.weights.wlb*100).toFixed(0)+'%' : ''"></strong></span>
        </div>
        <template x-for="g in profileData.groups" :key="g.title">
          <div class="profile-group">
            <h4 class="config-h" x-text="g.title"></h4>
            <div class="profile-fields">
              <template x-for="f in g.fields" :key="f.name">
                <div class="profile-field">
                  <label x-text="f.label"></label>
                  <template x-if="f.type==='bool'">
                    <select x-model="profileData.fields[f.name]">
                      <option :value="true">是</option>
                      <option :value="false">否</option>
                    </select>
                  </template>
                  <template x-if="f.type==='list'">
                    <input type="text" x-model="profileData.fields[f.name]" placeholder="逗号分隔">
                  </template>
                  <template x-if="f.type==='str'">
                    <input type="text" x-model="profileData.fields[f.name]">
                  </template>
                  <template x-if="f.type==='int' || f.type==='float'">
                    <input type="number" step="any" x-model.number="profileData.fields[f.name]">
                  </template>
                </div>
              </template>
            </div>
          </div>
        </template>
        <div class="profile-actions">
          <button class="primary" @click="saveProfile()" :disabled="profileSaving">
            <span x-show="!profileSaving">💾 保存画像</span>
            <span x-show="profileSaving">⏳ 保存中...</span>
          </button>
          <button @click="loadProfile()">↩️ 重新加载</button>
          <span style="color:var(--text3);font-size:12px">保存后请点击"规则打分"重新评分</span>
        </div>
      </div>
    </template>
    <div x-show="!profileData" class="loading">加载画像中...</div>
  </div>
</div>

<!-- Resume Panel -->
<div class="config-panel" x-show="showResume" x-cloak>
  <div class="config-tabs">
    <button class="active">📄 主简历 (Markdown)</button>
    <button @click="showResume=false" style="margin-left:auto">✕ 关闭</button>
  </div>
  <div class="config-body">
    <div class="config-meta">
      <span>状态: <strong x-text="resumeData.exists ? '已上传' : '未上传'"></strong></span>
      <span x-show="resumeData.exists">字数: <strong x-text="resumeData.size"></strong></span>
      <span x-show="resumeData.exists" style="color: var(--green)">✓ AI 打分会自动融入此简历</span>
    </div>
    <div class="resume-upload-area">
      <input type="file" accept=".md,.markdown,text/markdown,text/plain"
             @change="onResumeFile($event)" x-ref="resumeFileInput"
             style="display:none">
      <button @click="$refs.resumeFileInput.click()">📁 选择 .md 文件上传</button>
      <span style="color: var(--text3); font-size: 12px; margin-left: 8px">或直接在下方粘贴/编辑</span>
    </div>
    <textarea class="resume-editor" x-model="resumeData.content"
              placeholder="在此粘贴或编辑你的 Markdown 简历...&#10;&#10;建议包含: 个人信息、专业技能、工作经历、项目经历、教育背景。&#10;这份简历会作为 AI 打分的人岗匹配参考, 也会用于针对性简历生成。"
              spellcheck="false"></textarea>
    <div class="profile-actions">
      <button @click="saveResume()" :disabled="resumeSaving" class="primary">
        <span x-show="!resumeSaving">💾 保存简历</span>
        <span x-show="resumeSaving">⏳ 保存中...</span>
      </button>
      <button @click="clearResume()" x-show="resumeData.exists" style="color: var(--red)">清空</button>
      <span x-show="resumeSavedAt" style="color: var(--green); font-size: 12px" x-text="'✓ 已保存 ' + resumeSavedAt"></span>
    </div>
  </div>
</div>

<!-- Main -->
<div class="main" x-show="!showConfig && !showResume" :style="'padding-bottom: ' + (logCollapsed ? '32px' : '200px')">

  <!-- Job List -->
  <div class="list-panel">
    <div class="filters">
      <input type="text" placeholder="搜索职位/公司/技能..." x-model="filters.search" @input.debounce.300ms="loadJobs()">
      <select x-model="filters.city" @change="loadJobs()">
        <option value="">全部城市</option>
        <template x-for="c in stats.cities || []" :key="c.value">
          <option :value="c.value" x-text="c.value + ' (' + c.count + ')'"></option>
        </template>
      </select>
      <select x-model="filters.status" @change="loadJobs()">
        <option value="">全部状态</option>
        <option value="PASS">通过</option>
        <option value="REVIEW">待复核</option>
        <option value="REJECTED">已淘汰</option>
      </select>
      <select x-model="filters.scored" @change="loadJobs()">
        <option value="all">全部</option>
        <option value="none">未打分</option>
        <option value="rule_only">仅规则</option>
        <option value="ai">有AI打分</option>
      </select>
      <select x-model="filters.favorite" @change="loadJobs()">
        <option value="all">全部收藏</option>
        <option value="only">只看收藏</option>
        <option value="exclude">排除收藏</option>
      </select>
      <select x-model="filters.ignored" @change="loadJobs()">
        <option value="exclude">排除忽略</option>
        <option value="all">含忽略</option>
        <option value="only">只看忽略</option>
      </select>
      <select x-model="filters.sort" @change="loadJobs()">
        <option value="best_total">最佳分数</option>
        <option value="rule_total">规则分</option>
        <option value="latest_ai_total">AI分</option>
        <option value="salary_max">薪资上限</option>
        <option value="salary_min">薪资下限</option>
        <option value="salary_mid">薪资中位</option>
        <option value="favorited_at">收藏时间</option>
        <option value="last_seen">最近抓取</option>
        <option value="first_seen">首次抓取</option>
        <option value="quality_score">数据质量</option>
        <option value="jd_length">JD长度</option>
        <option value="exp_max">经验上限</option>
        <option value="title">职位名</option>
      </select>
    </div>
    <!-- 批量操作工具栏 -->
    <div class="batch-bar" x-show="selectedIds.length > 0" x-cloak>
      <span x-text="'已选 ' + selectedIds.length + ' 个'"></span>
      <button @click="batchDelete()" class="danger" :disabled="batchDeleting">
        <span x-show="!batchDeleting">🗑 删除选中</span>
        <span x-show="batchDeleting">⏳ 删除中...</span>
      </button>
      <button @click="clearSelection()">取消选择</button>
      <button @click="selectAllOnPage()">全选本页</button>
    </div>
    <div class="job-list">
      <div class="loading" x-show="jobsLoading">加载中...</div>
      <div class="empty" x-show="!jobsLoading && jobs.length === 0">没有匹配的职位</div>
      <template x-for="job in jobs" :key="job.job_id">
        <div class="job-item" :class="{active: selectedJobId === job.job_id, selected: selectedIds.includes(job.job_id)}" @click="selectJob(job.job_id)">
          <div class="job-item-top">
            <input type="checkbox" :checked="selectedIds.includes(job.job_id)" @click.stop="toggleSelect(job.job_id)" x-show="selectMode">
            <span class="fav-star" @click.stop="toggleFavorite(job.job_id, !job.favorite)" :class="{on: job.favorite}" x-text="job.favorite ? '★' : '☆'"></span>
            <div class="title" x-text="job.title"></div>
          </div>
          <div class="meta">
            <span x-text="job.company_name || '未知'"></span>
            <span x-text="job.city || ''"></span>
            <span class="salary" x-text="job.salary_raw || '面议'"></span>
          </div>
          <div class="scores">
            <template x-if="job.rule_status">
              <span class="badge" :class="job.rule_status.toLowerCase()" x-text="job.rule_status + ' ' + (job.rule_total || 0).toFixed(1)"></span>
            </template>
            <template x-if="!job.rule_status">
              <span class="badge none">未打分</span>
            </template>
            <template x-if="job.ai_count > 0">
              <span class="badge ai" x-text="'🤖 ' + job.ai_count + 'x ' + (job.latest_ai_total ? job.latest_ai_total.toFixed(1) : '')"></span>
            </template>
            <template x-if="job.ai_needed && job.ai_count === 0">
              <span class="badge review">需AI</span>
            </template>
          </div>
        </div>
      </template>
    </div>
    <div class="pagination">
      <button @click="prevPage()" :disabled="filters.offset === 0">上一页</button>
      <span style="color:var(--text3);font-size:12px;line-height:28px" x-text="(filters.offset + 1) + '-' + Math.min(filters.offset + jobs.length, jobsTotal) + ' / ' + jobsTotal"></span>
      <button @click="nextPage()" :disabled="filters.offset + jobs.length >= jobsTotal">下一页</button>
    </div>
  </div>

  <!-- Job Detail -->
  <div class="detail-panel">
    <div class="loading" x-show="detailLoading">加载中...</div>
    <div class="empty" x-show="!detailLoading && !detail">← 选择一个职位查看详情</div>
    <template x-if="detail && !detailLoading">
    <div class="detail-content" x-cloak>
      <h2 x-text="detail.job.title"></h2>
      <div class="info-grid" style="margin-bottom: 16px;">
        <div><span class="label">公司:</span> <span x-text="detail.company?.name || detail.job.company_name || '未知'"></span></div>
        <div><span class="label">行业:</span> <span x-text="detail.company?.industry || '-'"></span></div>
        <div><span class="label">薪资:</span> <span class="salary" style="color:var(--orange)" x-text="detail.job.salary?.raw || '面议'"></span></div>
        <div><span class="label">城市:</span> <span x-text="detail.job.city + ' ' + (detail.job.district || '')"></span></div>
        <div><span class="label">经验:</span> <span x-text="detail.job.experience?.raw || '不限'"></span></div>
        <div><span class="label">学历:</span> <span x-text="detail.job.education?.raw || '不限'"></span></div>
        <div><span class="label">规模:</span> <span x-text="detail.company?.scale_raw || '-'"></span></div>
        <div><span class="label">阶段:</span> <span x-text="detail.company?.stage || '-'"></span></div>
        <div><span class="label">技能:</span> <span x-text="(detail.job.skills || []).join(', ') || '-'"></span></div>
        <div><span class="label">福利:</span> <span x-text="(detail.job.welfare || []).join(', ') || '-'"></span></div>
        <div><span class="label">地址:</span> <span x-text="detail.job.address || '-'"></span></div>
        <div>
          <span class="label">坐标:</span>
          <template x-if="detail.job.gps">
            <span style="color:var(--text2)" x-text="detail.job.gps.lng + ', ' + detail.job.gps.lat"></span>
          </template>
          <template x-if="!detail.job.gps">
            <span style="color:var(--text3)">未记录</span>
          </template>
        </div>
        <div><span class="label">链接:</span> <a :href="detail.job.url" target="_blank">BOSS直聘 ↗</a></div>
        <div><span class="label">抓取:</span> <span x-text="detail.job.last_seen"></span></div>
      </div>

      <!-- Action Bar -->
      <div class="action-bar">
        <select x-model="aiProvider" style="min-width:100px">
          <template x-for="p in providers" :key="p">
            <option :value="p" x-text="p"></option>
          </template>
        </select>
        <button class="primary" @click="triggerAiScore()" :disabled="taskRunning('ai-score-' + selectedJobId + '-' + aiProvider)">
          <span x-show="!taskRunning('ai-score-' + selectedJobId + '-' + aiProvider)">🤖 AI 打分</span>
          <span x-show="taskRunning('ai-score-' + selectedJobId + '-' + aiProvider)">⏳ 打分中...</span>
        </button>
        <button @click="triggerAiScore(true)" :disabled="taskRunning('ai-score-' + selectedJobId + '-' + aiProvider)">📋 深度分析</button>
        <button @click="triggerResume()" :disabled="taskRunning('resume-' + selectedJobId + '-' + aiProvider)">📄 生成简历</button>
        <span style="flex:1"></span>
        <button @click="toggleFavorite(selectedJobId, !detail.job.favorite)" :class="{primary: detail.job.favorite}">
          <span x-show="!detail.job.favorite">☆ 收藏</span>
          <span x-show="detail.job.favorite">★ 已收藏</span>
        </button>
        <button @click="toggleIgnore(selectedJobId, !detail.job.ignored)" :class="{primary: detail.job.ignored}">
          <span x-show="!detail.job.ignored">🚫 忽略</span>
          <span x-show="detail.job.ignored">🚫 已忽略</span>
        </button>
        <button class="danger" @click="deleteJob(selectedJobId)">🗑 删除职位</button>
      </div>

      <!-- Rule Score -->
      <div class="detail-section" x-show="detail.rule_score">
        <h3>规则打分</h3>
        <div class="score-card">
          <div class="header-row">
            <span class="badge" :class="detail.rule_score.status.toLowerCase()" x-text="detail.rule_score.status"></span>
            <span class="total" x-text="(detail.rule_score.total_score || 0).toFixed(1) + '/10'"></span>
            <span style="color:var(--text3)" x-text="'(' + (detail.rule_score.total_100 || 0).toFixed(0) + '分)'"></span>
            <span style="color:var(--text3);margin-left:auto" x-text="detail.rule_score.rules_version ? 'v' + detail.rule_score.rules_version : ''"></span>
          </div>
          <div class="dims">
            <template x-for="(val, key) in detail.rule_score.dimension_scores || {}" :key="key">
              <div class="dim">
                <div class="val" x-text="(val || 0).toFixed(1)"></div>
                <div class="lbl" x-text="{finance:'财务',growth:'成长',resource:'资源',wlb:'WLB'}[key] || key"></div>
                <div class="dim-bar"><div class="fill" :style="'width:' + (val || 0) * 10 + '%'"></div></div>
              </div>
            </template>
          </div>
          <div style="margin-top:8px;font-size:12px;color:var(--text2)" x-show="detail.rule_score.reject_reason">
            <span style="color:var(--red)">淘汰: </span><span x-text="detail.rule_score.reject_reason"></span>
          </div>
          <template x-for="w in detail.rule_score.warnings || []" :key="w">
            <div style="font-size:12px;color:var(--yellow);margin-top:2px">⚠ <span x-text="w"></span></div>
          </template>
          <template x-for="t in detail.rule_score.triggered_ai_rules || []" :key="t.code">
            <div style="font-size:12px;color:var(--purple);margin-top:2px">→ <strong x-text="t.code"></strong> <span x-text="t.reason"></span></div>
          </template>
        </div>
      </div>

      <!-- Manual Override -->
      <div class="detail-section">
        <h3>✋ 人工调分</h3>
        <div class="manual-override-box">
          <template x-if="detail.job.manual_override && detail.job.manual_override.total !== undefined && detail.job.manual_override.total !== null">
            <div class="manual-current">
              <span>当前人工调分: <strong style="color:var(--orange);font-size:16px" x-text="(detail.job.manual_override.total || 0).toFixed(1) + ' 分'"></strong></span>
              <span style="color:var(--text3);margin-left:8px" x-text="detail.job.manual_override.at ? '于 ' + detail.job.manual_override.at : ''"></span>
              <div class="manual-note-display" x-show="detail.job.manual_override.note" x-text="'备注: ' + detail.job.manual_override.note"></div>
            </div>
          </template>
          <div class="manual-edit-row">
            <label>调整分数:</label>
            <input type="number" step="0.1" min="0" max="100" style="width:80px"
                   x-model="manualEdit.total"
                   :placeholder="detail.job.manual_override && detail.job.manual_override.total != null ? detail.job.manual_override.total.toFixed(1) : '如 7.5'">
            <label style="margin-left:8px">备注:</label>
            <input type="text" style="flex:1;min-width:200px"
                   x-model="manualEdit.note"
                   placeholder="如: 条件太苛刻实际可接受 / 简历没写充分其实匹配 / ...">
            <button class="primary" @click="saveManualOverride()" :disabled="manualSaving">
              <span x-show="!manualSaving">保存</span>
              <span x-show="manualSaving">⏳</span>
            </button>
            <button @click="clearManualOverride()" x-show="detail.job.manual_override && detail.job.manual_override.total != null" style="color:var(--red)">清除</button>
          </div>
          <div style="font-size:11px;color:var(--text3);margin-top:4px">
            人工调分会覆盖 AI/规则分用于排序。备注会在后续生成简历时引用。
          </div>
        </div>
      </div>

      <!-- AI Scores -->
      <div class="detail-section" x-show="detail.ai_scores && detail.ai_scores.length > 0">
        <h3>AI 打分 (<span x-text="detail.ai_scores.length"></span> 次)</h3>
        <template x-for="s in detail.ai_scores" :key="s._file || s.created_at">
          <div class="ai-score-section">
            <div class="header-row">
              <span class="provider" x-text="'🤖 ' + s.provider"></span>
              <span class="badge" :class="s.status.toLowerCase()" x-text="s.status"></span>
              <span class="total" style="font-size:18px" x-text="(s.total_score || 0).toFixed(1) + '/10'"></span>
              <span class="badge ai" x-text="s.recommendation"></span>
              <span style="color:var(--text3);margin-left:auto;font-size:12px" x-text="s.created_at"></span>
              <button class="danger" style="padding:2px 8px;font-size:11px" @click="deleteAiScore(s._file)">🗑 删除</button>
            </div>
            <div class="dims" style="margin:6px 0">
              <template x-for="key in ['finance','growth','resource','wlb']" :key="key">
                <div class="dim">
                  <div class="val" x-text="((s.dimension_scores || {})[key] || 0).toFixed(1)"></div>
                  <div class="lbl" x-text="{finance:'财务',growth:'成长',resource:'资源',wlb:'WLB'}[key]"></div>
                </div>
              </template>
            </div>
            <div class="reason" x-show="s.recommendation_reason" x-text="s.recommendation_reason"></div>
            <template x-for="h in s.highlights || []" :key="h">
              <div class="tag highlight">+ <span x-text="h"></span></div>
            </template>
            <template x-for="r in s.risks || []" :key="r">
              <div class="tag risk">! <span x-text="r"></span></div>
            </template>
            <div class="reason" x-show="s.deep_analysis_report" style="white-space:pre-wrap;border-top:1px solid var(--border);padding-top:6px;margin-top:6px" x-text="s.deep_analysis_report"></div>
          </div>
        </template>
      </div>

      <!-- JD -->
      <div class="detail-section">
        <h3>岗位描述</h3>
        <div class="jd-text" x-text="detail.jd_text || detail.job.jd?.full || '无 JD'"></div>
      </div>

      <!-- Company -->
      <div class="detail-section" x-show="detail.company && detail.company.intro">
        <h3>公司简介</h3>
        <div class="jd-text" x-text="detail.company?.intro || ''"></div>
      </div>
    </div>
    </template>
  </div>
</div>

<!-- Log Panel -->
<div class="log-panel" :class="{collapsed: logCollapsed}">
  <div class="log-header" @click="logCollapsed = !logCollapsed">
    <span class="title">📜 实时日志</span>
    <span class="count" x-text="logs.length"></span>
    <span style="margin-left:auto;font-size:12px;color:var(--text3)" x-show="!sseConnected">⚠ 未连接</span>
    <span style="margin-left:auto;font-size:12px;color:var(--green)" x-show="sseConnected">● 已连接</span>
  </div>
  <div class="log-body" x-ref="logBody">
    <template x-for="(line, i) in logs.slice(-200)" :key="i">
      <div class="log-line">
        <span class="ts" x-text="new Date(line.ts * 1000).toLocaleTimeString()"></span>
        <span class="lvl" :class="line.level" x-text="line.level"></span>
        <span class="msg" x-text="line.message"></span>
      </div>
    </template>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
